[project]
name = "neighbourhood-score"
version = "2.0.0"
description = "Data-driven neighborhood scoring for Bangalore home buyers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "pydantic>=2.12.5",
    "pandas>=3.0.2",
    "geopandas>=1.1.3",
    "osmnx>=2.1.0",
    "overpy>=0.7",
    "geopy>=2.4.1",
    "httpx>=0.28.1",
    "shapely>=2.1.2",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.4",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "anthropic>=0.94.0",
    "pyjwt>=2.12.1",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.49",
    "cryptography>=46.0.7",
    "feedparser>=6.0.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "bandit>=1.9.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Anthropic SDK returns union types; code already uses `type: ignore` inline
unresolved-attribute = "warn"
no-matching-overload = "warn"

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B310", "B405", "B314", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
